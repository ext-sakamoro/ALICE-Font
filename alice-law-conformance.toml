[G7]
status = "fail-known"
since = ""
note = "the library serializes Law-bearing glyph geometry across a byte boundary WITHOUT an identifier header: the std140 GPU writers (`src/shader.rs#AnalyticalGlyphPayload::to_std140_bytes`, MultiGlyphPayload::to_std140_ubo_chunks, `src/outline.rs#OutlineGlyphPayload::to_std140_bytes` and the multi-glyph chunking, `src/skeleton_shader.rs#MultiSkeletonGlyphPayload::to_std140_ubo_chunks`) emit raw little-endian f32 bezier control points, pen parameters and advances with no magic / version / identifier, and the serde Serialize derives on the same payload types (feature `serde`) write the geometry as JSON with no envelope. The inbound sfnt / OTF reader (crates/alice-sfnt) validates a read-side version magic (0x00010000 / 'true' / 'OTTO') and emits no bytes. Located absence: there is no FONT_SEMANTICS_ID (see G6) and no magic+version+identifier on any output form, so these boundaries carry no Law identifier to check. The next stacks add FONT_SEMANTICS_ID (G6) then stamp the std140 and serde payloads with a magic+version+identifier header plus a boundary scan (ALICE-SDF's api_boundary.py style) and verifying readers, and flip G7 to pass."
reference_repo = "ALICE-SDF"

