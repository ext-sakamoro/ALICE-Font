[G7]
status = "pass"
evidence = [
    "src/law_stamp.rs stamps the serialized geometry with the Law identifier: StampedForm::stamped prepends a fixed header (STAMP_MAGIC 89 'A' 'L' 'F' 0D 0A 1A 0A, a major and minor version, and the v2 Law identifier) to a form's canonical body, where the identifier is alice_zip::law_id::LawIdHasher of the form's KIND tag and FONT_SEMANTICS_ID over the body. The five forms (AnalyticalGlyphPayload / MultiGlyphPayload / OutlineGlyphPayload / MultiOutlineGlyphPayload / MultiSkeletonGlyphPayload) implement it (single buffer = the raw std140 bytes, multi = frame_chunks of the UBO chunks); the serde form is StampedEnvelope (feature serde), the same header and identifier as a JSON object",
    "the raw to_std140* bytes are left byte-identical: their only consumer is this crate's own shader of the same build, which reads them at the documented layout with no header. scripts/api_boundary.py (the shared ecosystem scanner, the same bytes as ALICE-Analytics et al.) enumerates the whole public API boundary from rustdoc JSON and requires every item decided in scripts/api_boundary.toml: the std140 emitters are `local` (same-build shader bytes, nothing from another producer decoded), the stamp readers (law_stamp::read, StampedEnvelope::open, the envelope's Deserialize) are `handshake` entries naming the identifier-refusal tests, and the rest (font geometry / layout / licence token / the 40-byte parameter input) are `local`; an item with no decision, or a scan that enumerated nothing, fails (scripts/test_api_boundary.py covers the scanner)",
    "a compile-time guard (src/law_stamp.rs const block) fails the build unless the resolved alice_det_math::SEMANTICS_ID is DET_MATH_GENERATION (the generation FONT_SEMANTICS_ID was folded against); alice-zip pins the same alice-det-math revision, so cargo resolves one arithmetic across the graph",
    "tests/law_stamp.rs round-trips each of the five forms through stamped()/read() and through the serde envelope, and scripts/api_boundary.py + test_api_boundary.py run in .github/workflows/ci.yml and scripts/preflight.sh",
]
mutant = "measured 2026-10-26, each reverted: removing read's identifier comparison (`if recomputed != stamped` -> `if false`) reds a_tampered_identifier_is_rejected, the_wrong_form_is_rejected and an_identifier_from_another_semantics_is_rejected; flipping one byte of DET_MATH_GENERATION fails the compile at the const guard (error[E0080], 'alice-det-math generation changed'); a public boundary item with no decision in scripts/api_boundary.toml makes scripts/api_boundary.py exit 1 (`not in scripts/api_boundary.toml`), and dropping a handshake test name reds the scanner's handshake check"
since = "2026-10-26"
note = "the raw std140 bytes carry no header on purpose: the consumer is this crate's own fragment shader of the same build, which reads the glyph data at the layout to_std140* documents; the boundary scan classifies them as raw-same-build so a new unclassified emitter cannot ship. What crosses a process or file boundary is the stamped envelope (StampedForm::stamped for bytes, StampedEnvelope for JSON), which carries FONT_SEMANTICS_ID. The envelope version is G9's subject (a later stack)."
reference_repo = "ALICE-SDF"

