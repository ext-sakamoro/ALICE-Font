# ALICE-Law conformance manifest for this crate (alice-font + alice-sfnt). One entry per
# gate defined in ALICE-Law's conformance/gates.toml; the schema (status / evidence /
# since / note / reference_repo) is the "Manifest" section of docs/CONFORMANCE.md in that
# repository.
#
# Every entry was written from a measurement on this repository at the commit this file is
# added on: the library and test suites were run (debug and release, the default, std / ffi /
# serde and sdf feature sets), clippy was run with the crate's own root configuration (all
# targets) and with the library configuration (.github/clippy-lib, library only, per feature),
# and every `pass` carries a measured mutant. The crate computes glyph geometry in floating
# point: the signed distance field is f64 and alice_det_math::ops::sqrt64 (correctly rounded),
# the recorded bits pinned by tests/outline_raster.rs. Several gates are fail-known this
# commit with a located-absence note (G2 the float min/max helpers, G6 the identifier, G7 / G8
# / G9 the identifier on the serialized geometry, G11 the generated table); each lands in a
# later stack and the note says where.

[G1]
status = "pass"
evidence = [
    "the library's float transcendentals are banned: scripts/clippy_lib_gate.toml lists every f32 / f64 transcendental (sin, cos, sin_cos, tan, asin, acos, atan, atan2, sinh, cosh, tanh, asinh, acosh, atanh, exp, exp2, exp_m1, ln, ln_1p, log, log2, log10, powf, powi, cbrt, hypot) as a library-only entry; scripts/clippy_lib_gate.py --write composes them with the root clippy.toml into .github/clippy-lib/clippy.toml (byte-compared by --check), applied with CLIPPY_CONF_DIR to `cargo clippy --lib` per feature set",
    ".github/workflows/ci.yml clippy job steps `.github/workflows/ci.yml#- name: Clippy (library code, float transcendentals forbidden; default)`, `#std,ffi,serde` and `#sdf`, each -D warnings; the pyo3 feature set on the pyo3 job `.github/workflows/ci.yml#- name: Clippy (library code, float transcendentals forbidden; all features incl. pyo3)`; scripts/preflight.sh runs the default / std,ffi,serde / sdf legs (pyo3 is runner-only: the pyo3 0.22 build refuses a Python newer than 3.13)",
    "scripts/clippy_lib_gate.py canary: scripts/clippy-lib-canary (a standalone crate that calls every forbidden form once) must get a disallowed-method diagnostic naming each form's path (0 forms, a clean clippy exit, or a drifted generated file fail); `.github/workflows/ci.yml#- name: Clippy lib gate (regenerate check + canary)` and `#Clippy lib gate (tests)`, and scripts/preflight.sh",
    "the library's own float arithmetic goes through alice_det_math: the SDF distance is alice_det_math::ops::sqrt64 at `src/outline/raster.rs#let d = alice_det_math::ops::sqrt64(d2)` (correctly rounded, the same bits on every target), pinned by tests/outline_raster.rs",
]
mutant = "measured 2026-10-26, each reverted: `fn g1_mutant_plain(x: f32) -> f32 { x.sin() }` in src/lib.rs makes `CLIPPY_CONF_DIR=.github/clippy-lib cargo clippy --lib` report f32::sin (exit 101); the same under `#[cfg(feature = \"sdf\")]` with `x.cos()` makes the sdf-feature lib leg report f64::cos; the same `(0.5f32).sin()` placed in tests/ leaves `cargo clippy --all-targets` (root configuration) at 0 disallowed methods, which is the point of the two configurations (the independent analytic oracles keep the std transcendentals)"
since = ""
note = "the stroke outline uses a bounded fast inverse square root (Quake / Lomont, src/stroke.rs and src/glyph/mod.rs): it is deterministic (f32::from_bits / to_bits and IEEE multiply / subtract, the same bits on every target) and calls none of the methods the G1 list names, so clippy does not flag it; its error against the exact reciprocal square root is pinned in tests/analytic_oracle.rs (the Lomont two-step bound). alice-det-math is the arithmetic for the SDF; the ban keeps a platform libm transcendental out of the library."
reference_repo = "ALICE-SDF"

[G2]
status = "fail-known"
since = ""
note = "the library still computes a few float minima and maxima directly rather than through a Law min / max helper that fixes the sign of an equal pair of zeros: `src/outline/raster.rs` folds the boundary distances with f64::min and clamps to 0.0 / 1.0, `src/game.rs` and `src/glyph/mod.rs` clamp, and `src/medial_axis/chain_trace.rs` takes component-wise min / max of f32 points. Located absence: there is no f32 / f64 max / min / clamp entry in the root clippy.toml or in scripts/clippy_lib_gate.toml yet, and no tie test. The next stack routes these sites through the alice-det-math (or an ALICE-SDF-style law_min_f32 / law_max_f32) helpers, adds the max / min / clamp bans to the library configuration with a per-site-class tie test (bounds built from points; distances), and flips this to pass. The sign of an equal pair of zeros does not reach a stored value today only because nothing of the crate is stored (see G7)."
reference_repo = "ALICE-SDF"

