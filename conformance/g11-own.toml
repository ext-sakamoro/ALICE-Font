# ALICE-Law G11: this repository's own rows of conformance/g11.toml (the rows of the checkers the ALICE crates
# share are generated from ALICE-Law). ALICE-Law's scripts/g11_table_gen.py writes conformance/g11.toml from both
# (python3 scripts/g11_table_gen.py --repo <this repository> --name ALICE-Font --write, run in an ALICE-Law checkout).
#
# The Law test binaries are run by scripts/run_tests.sh, which fails a step when a named binary ran fewer tests
# than named; its zero test is therefore the compared-nothing test of each row.

[[row]]
gate = "G4"
checker = ".github/workflows/ci.yml#- name: Semantics identifier reproduces (goldens + fold) and the Law stamp round-trips>scripts/run_tests.sh"
canary = "tests/semantics_golden.rs::checker_rejects_a_wrong_digest"
zero = "scripts/test_run_tests.py::RunTests.test_a_named_file_that_ran_zero_fails"
shared = ["scripts/run_tests.sh", "scripts/test_run_tests.py"]

[[row]]
gate = "G5"
checker = ".github/workflows/ci.yml#- name: Semantics identifier reproduces under the release profile (goldens + fold, Law stamp)>scripts/run_tests.sh"
canary = "tests/semantics_golden.rs::checker_rejects_a_wrong_digest"
zero = "scripts/test_run_tests.py::RunTests.test_a_named_file_that_ran_zero_fails"
shared = ["scripts/run_tests.sh", "scripts/test_run_tests.py"]

[[row]]
gate = "G6"
checker = ".github/workflows/ci.yml#- name: Semantics identifier reproduces (goldens + fold) and the Law stamp round-trips>scripts/run_tests.sh"
canary = "tests/font_semantics_id.rs::one_changed_bit_in_any_entry_changes_the_identifier"
zero = "scripts/test_run_tests.py::RunTests.test_a_named_file_that_ran_zero_fails"
shared = ["scripts/run_tests.sh", "scripts/test_run_tests.py"]

[[row]]
gate = "G8"
checker = ".github/workflows/ci.yml#- name: Semantics identifier reproduces (goldens + fold) and the Law stamp round-trips>scripts/run_tests.sh"
canary = "tests/law_stamp.rs::a_tampered_identifier_is_rejected"
zero = "scripts/test_run_tests.py::RunTests.test_a_named_file_that_ran_zero_fails"
shared = ["scripts/run_tests.sh", "scripts/test_run_tests.py"]
