# Classifies every byte-emitting `pub fn` under src/ for scripts/api_boundary.py (ALICE-Law G7).
# Each emitter is either `raw-same-build` (a raw buffer whose only consumer is this crate's own
# shader of the same build, which reads it at a fixed std140 layout with no header) or `stamped`
# (it carries the Law identifier). A byte emitter not listed here fails the scan.

[[emitter]]
fn = "to_std140_bytes"
class = "raw-same-build"
reason = "std140 UBO bytes of one glyph, read by this crate's own fragment shader of the same build at the layout the method documents; the cross-boundary form is law_stamp (StampedForm::stamped / StampedEnvelope), which carries FONT_SEMANTICS_ID"

[[emitter]]
fn = "to_std140_ubo_chunks"
class = "raw-same-build"
reason = "std140 UBO chunks of a glyph run, same same-build-shader consumer as to_std140_bytes; the cross-boundary form is law_stamp over frame_chunks of these chunks"
