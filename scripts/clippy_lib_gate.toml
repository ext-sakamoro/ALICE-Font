# Per-repository data of scripts/clippy_lib_gate.py (the script is the same file in every
# repository that carries it): the library-only float-transcendental bans (ALICE-Law G1)
# and the canary forms, each with the path its disallowed-method diagnostic must name

header = """\
# Generated by scripts/clippy_lib_gate.py from the repository's clippy.toml:
# do not edit (python3 scripts/clippy_lib_gate.py --write)
#
# The library code (`cargo clippy --lib`, CLIPPY_CONF_DIR=.github/clippy-lib) may not
# call the platform float transcendentals (ALICE-Law G1): they are not cross-platform
# bit-exact, so every one goes through alice-det-math. Tests, examples and benches keep
# the std functions (independent analytic oracles), so these entries live only here.

"""

method-reason = "platform libm is not cross-platform bit-exact; use alice_det_math"

