# cargo-deny 設定 (v0.14+ schema)
# https://embarkstudios.github.io/cargo-deny/
#
# ALICE-SDF v1.7.7 (commit 52d26f9) の deny.toml を base に ALICE-Font 用に調整
#
# Font 系 license (OFL-1.1 / Ubuntu-font-1.0) を allowlist に追加
# (canonical trap #14、alice-font は fonts 系 transitive dep 可能性あり)

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories (RustSec CVE + yanked)
# ---------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
ignore = [
    # ALICE-Font optional `pyo3` 0.22 系 CVE 群 全て 0.29 移行で解消可
    # (ALICE-SDF で同 pattern の 0.23→0.29 migration 済
    # 移行完了時に全 ignore 削除
    "RUSTSEC-2025-0020",  # PyString::from_object buffer overflow (0.24.1+ で fix)
    "RUSTSEC-2026-0176",  # nth/nth_back out-of-bounds read (0.29 で fix)
    "RUSTSEC-2026-0177",  # PyCFunction::new_closure Sync 欠落 (0.29 で fix)
    # bincode 2.x unmaintained (transitive、直接依存なし)
    "RUSTSEC-2025-0141",
    # paste 1.0.15 unmaintained (pyo3-macros transitive)
    "RUSTSEC-2024-0436",
]

# ---------------------------------------------------------------------------
# Licenses (allow-list 方式)
# ---------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
    # Font-related licenses (canonical trap #14, alice-font 特に関連)
    "OFL-1.1",           # SIL Open Font License (Noto / Ubuntu Mono 等)
    "Ubuntu-font-1.0",   # Ubuntu Font License
    # LLVM ecosystem (libfuzzer-sys 経由で fuzz job が拾う可能性)
    "NCSA",
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "webpki"
version = "*"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

# alice-font is proprietary (LicenseRef-Proprietary, publish = false)
[[licenses.exceptions]]
name = "alice-font"
allow = ["LicenseRef-Proprietary"]

# alice-sfnt (workspace member, the TrueType / OpenType reader) is proprietary too
[[licenses.exceptions]]
name = "alice-sfnt"
allow = ["LicenseRef-Proprietary"]

# alice-zip (the Law identifier hasher): the exception is the declaration of the pinned rev
# (LicenseRef-Proprietary); it changes in the commit that moves the pin
[[licenses.exceptions]]
name = "alice-zip"
allow = ["LicenseRef-Proprietary"]

# ---------------------------------------------------------------------------
# Bans (banned crate / duplicate / wildcard)
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"   # path dep が wildcard version になるため必須
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/ext-sakamoro/ALICE-DetMath"]

[sources.allow-org]
