# A glyph outline, a stroke skeleton and a raster digest must be reproduced
# bit for bit on every machine (the recorded-bit goldens depend on it). IEEE
# 754 does not require the transcendentals to be correctly rounded, so the
# platform libm may differ between OS, CPU and compiler, and a value computed
# with it would differ with them; the computation goes through alice_det_math
# instead. This list keeps a call to the std method from coming in unnoticed.
#
# The entries are the f32 / f64 method part of the lists ALICE-DB and
# alice-zip use. The libm free functions of alice-zip's list are not named:
# alice-font does not depend on libm, so none can be. CI runs clippy with
# `--all-targets ... -D warnings`, which turns `disallowed_methods` into a red
# gate for the library, the tests, the examples and the benches alike.
# scripts/clippy_canary.py plants one call per entry and fails unless clippy
# flags each one.
#
# Deliberately absent: `sqrt`, `floor`, `round`, `trunc`, `ceil` and `mul_add`.
# IEEE 754 specifies each of them exactly.
#
# Deliberately NOT yet enabled: ALICE-Law G2 (std's float max / min / clamp).
# src/ has float min / max / clamp sites that are not yet routed through a Law
# helper (alice-det-math's max / min / clamp); banning them now would make
# clippy red before that routing lands. The G2 bans come in a later stack,
# together with the routing. (ALICE-Crypto's clippy.toml carries them because
# its src/ has none.)
#
# Oracles whose expected value must not come from the implementation under
# test carry a scoped #[expect] with the reason (it fails if the banned call
# goes away, so it cannot go stale).
