name: CI

# - test / clippy / doc を default + full native feature set (std,ffi,serde) で `-D warnings`
# - no_std: `cargo check --no-default-features` は以前から green だったので `continue-on-error` を撤去し
#   bare-metal thumbv7em (rust-toolchain.toml の `targets`) で本物の no_std を証明
# - feature-powerset: std 固定 depth 2 (pyo3 と sdf を除外、pyo3 は pyo3 job、sdf は build job)
#   security-audit / fuzz の stub action は撤去 (real dep を audit / deny が見る)

on:
  push:
    branches: [main, 'ci/**']

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  # full native feature set (pyo3 / sdf を除く、test / clippy / doc で共用)
  NATIVE_FEATURES: "std,ffi,serde"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  test:
    name: Test (default + full native)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - name: Test (default features = std)
        run: cargo test --workspace
      - name: Test (full native feature set)
        run: cargo test --workspace --features "$NATIVE_FEATURES"

  raster-bits:
    name: Outline raster bits (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - name: Outline raster oracles and output digest
        run: cargo test --test outline_raster

  clippy:
    name: Clippy (all targets, -D warnings)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - name: Clippy (default features, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (full native feature set, all targets)
        run: cargo clippy --workspace --features "$NATIVE_FEATURES" --all-targets -- -D warnings
      # ALICE-Law G1: the library additionally may not call the float transcendentals
      # (scripts/clippy_lib_gate.toml extras -> .github/clippy-lib/clippy.toml, generated by
      # scripts/clippy_lib_gate.py --write and compared byte for byte). Enforced on the library
      # only (CLIPPY_CONF_DIR) per feature set; tests, examples and benches keep the std
      # transcendentals for the independent analytic oracles. The always-true bans (G10 clock /
      # entropy, G13 hash order, G3 mul_add) stay in the root clippy.toml above, strict on all targets.
      - name: Clippy (library code, float transcendentals forbidden; default)
        env:
          CLIPPY_CONF_DIR: .github/clippy-lib
        run: cargo clippy --lib -- -D warnings
      - name: Clippy (library code, float transcendentals forbidden; std,ffi,serde)
        env:
          CLIPPY_CONF_DIR: .github/clippy-lib
        run: cargo clippy --lib --features "std,ffi,serde" -- -D warnings
      - name: Clippy (library code, float transcendentals forbidden; sdf)
        env:
          CLIPPY_CONF_DIR: .github/clippy-lib
        run: cargo clippy --lib --features sdf -- -D warnings
      # the lib configuration is generated from the root (clippy_lib_gate.py --check), and the
      # canary crate uses every forbidden form once: each must get a disallowed diagnostic naming
      # its path (0 forms, a clean exit, or a drifted generated file fail)
      - name: Clippy lib gate (regenerate check + canary)
        run: python3 scripts/clippy_lib_gate.py
      - name: Clippy lib gate (tests)
        run: python3 scripts/test_clippy_lib_gate.py
      # ALICE-Law G7 / G8: the public API boundary, enumerated from rustdoc JSON (the scanner sets
      # RUSTC_BOOTSTRAP=1 on the pinned toolchain), with every item decided in scripts/api_boundary.toml
      # (handshake = the reader checks a producer's identifier; local = no stamped Law value crosses)
      - name: API boundary (tests)
        run: python3 scripts/test_api_boundary.py
      - name: API boundary (rustdoc JSON, every item decided)
        run: python3 scripts/api_boundary.py

  pyo3:
    # every feature, pyo3 included, against a pinned Python (the pyo3 0.22 build script refuses a Python newer
    # than it supports); runner-only, the local preflight does not reproduce it
    name: Clippy (all features incl. pyo3, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (all features, all targets)
        env:
          PYO3_PYTHON: python3.12
        run: |
          python3 --version
          cargo clippy --workspace --all-features --all-targets -- -D warnings
      - name: Clippy (library code, float transcendentals forbidden; all features incl. pyo3)
        env:
          PYO3_PYTHON: python3.12
          CLIPPY_CONF_DIR: .github/clippy-lib
        run: cargo clippy --lib --all-features -- -D warnings

  build:
    name: Build (sdf bridge + no_std host / bare-metal)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      # thumbv7em target は rust-toolchain.toml の `targets` で pinned toolchain 側に install
      # (dtolnay の `targets:` は stable 側に入り pin と別 toolchain になる)
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - name: Build (sdf feature = alice-sdf bridge)
        run: cargo check --workspace --features sdf
      # crate 間契約 oracle (Font → alice-sdf): feature-gated test は専用 step で必ず走らせる
      - name: Test (sdf feature = Font → alice-sdf contract oracle)
        run: cargo test --workspace --features sdf --test analytic_oracle
      - name: Build (no_std, host)
        run: cargo check --workspace --no-default-features
      - name: Build (no_std, bare-metal thumbv7em-none-eabihf)
        run: cargo check --lib --no-default-features --target thumbv7em-none-eabihf

  feature-powerset:
    name: Feature powerset (cargo-hack, std 固定, depth 2)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - name: Powerset (std + {ffi, serde} depth 2)
        run: cargo hack check --lib --feature-powerset --depth 2 --exclude-features pyo3,sdf --features std

  doc:
    name: Doc (-D warnings)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - name: Doc (full native feature set)
        run: cargo doc --no-deps --features "$NATIVE_FEATURES"
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  float-environment:
    # ALICE-Law G14 on each OS: round-to-nearest-even and no flush-to-zero at run time
    # in both profiles (scripts/run_tests.sh float_environment=2 fails unless both tests
    # passed), the static build configuration guard, and on ubuntu / macOS the flags cargo
    # really passes to rustc (scripts/build_flags_check.py). Also G11 (c) shared files, and
    # G3 (the syntax-tree half of the negated-fma check; the IR half is g3-ir.yml).
    name: Float environment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Float environment (debug and release)
        run: |
          scripts/run_tests.sh float_environment=2 -- cargo test --test float_environment
          scripts/run_tests.sh float_environment=2 -- cargo test --release --test float_environment
      - name: run_tests.sh and build configuration guard (tests, then check)
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/test_run_tests.py
          "$PY" scripts/test_build_config_guard.py
          "$PY" scripts/build_config_guard.py
          "$PY" scripts/test_build_flags_check.py
      # ALICE-Law G11 (c): the files shared with the other crates are the bytes ALICE-Law's
      # table records (table and checker fetched at .github/shared-files-pin, both SHA-256
      # pinned); a difference, an unlisted shared path or nothing compared fails
      - name: Shared files equal ALICE-Law's table
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/test_shared_files.py
          scripts/shared_files.sh
      # ALICE-Law G6: FONT_SEMANTICS_ID is the fold of the recorded-bit goldens and alice-det-math's
      # identifier; this leg proves the goldens reproduce bit for bit on every OS, and run_tests.sh fails
      # if a scenario is dropped (the fold would silently shrink)
      - name: Semantics identifier reproduces (goldens + fold) and the Law stamp round-trips
        run: scripts/run_tests.sh semantics_golden=10,font_semantics_id=8,law_stamp=8 -- cargo test --test semantics_golden --test font_semantics_id --test law_stamp
      - name: Effective rustc flags (default, full native feature set, no default features)
        if: runner.os != 'Windows'
        run: |
          python3 scripts/build_flags_check.py -- cargo check --release --lib
          python3 scripts/build_flags_check.py -- cargo check --release --lib --features "$NATIVE_FEATURES"
          python3 scripts/build_flags_check.py -- cargo check --release --lib --no-default-features
      # ALICE-Law G3, syntax-tree pre-check (tools/no-outer-fneg-of-fma, byte-identical to
      # ALICE-LOL's): its own tests, then the check over src/ tests/ examples/ benches/ with
      # the exact fma-call counts of scripts/no-outer-fneg-of-fma-allowlist.toml (0 here);
      # the IR half is .github/workflows/g3-ir.yml
      - name: No negated fma result (syntax tree, tests then check)
        run: |
          cargo fmt --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml -- --check
          cargo test --quiet --locked --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml
          cargo run --quiet --locked --release --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml -- --root .
          # scripts/changed_paths.py decides whether the path-filtered workflows run; its own
          # tests, then the trigger lint (no on.push paths off main, each pattern file equals
          # its workflow's pull_request paths, the gate job needs every job)
          python3 scripts/test_changed_paths.py
          python3 scripts/changed_paths.py sync

  msrv:
    # the root crate declares rust-version 1.87 (alice-zip's Law identifier hasher requires it);
    # build it on exactly that toolchain so a dependency or a 2021-edition feature that needs a
    # newer rustc cannot slip in unnoticed. crates/alice-sfnt keeps its own 1.85 floor and is not
    # gated here (it does not depend on alice-zip).
    name: MSRV (alice-font root, Rust 1.87)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - name: Check (default features)
        run: cargo check -p alice-font
      - name: Check (full native feature set)
        run: cargo check -p alice-font --features "std,ffi,serde"
      - name: Check (no_std, no default features)
        run: cargo check -p alice-font --no-default-features

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
